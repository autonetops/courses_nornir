# nornir-lab/pyproject.toml — Capitulo 3: Execucao de Tarefas e Plugins
#
#     cd 3-tarefas-e-plugins
#     uv sync
#     uv run python resultado_lab.py   # device-free
#     uv run python render_lab.py      # device-free (Jinja2)
#     uv run python plugins_lab.py     # netmiko x napalm x scrapli (precisa de creds)
#
# Entram aqui os plugins de conexao (napalm, scrapli), o de template (jinja2)
# e o `requests`/`urllib3` da task HTTP do F5 (tasks/f5_api.py).

[project]
name = "nornir-lab-cap3"
version = "3.0.0"
description = "Cap. 3 — Tarefas e plugins: tasks custom, netmiko/napalm/scrapli, dry-run e Jinja2"
requires-python = ">=3.12,<3.13"

dependencies = [
    "nornir==3.5.0",
    "nornir-netmiko==1.0.1",
    "nornir-napalm==0.5.0",
    "nornir-scrapli==2025.1.30",
    "nornir-jinja2==0.2.0",
    "nornir-utils==0.2.0",
    # Usados diretamente pela task API-only do F5 (iControl REST).
    "requests>=2.32",
    "urllib3>=2.0",
]

[tool.uv]
package = false
