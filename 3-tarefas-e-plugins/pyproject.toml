# nornir-lab/pyproject.toml — Capitulo 3: Execucao de Tarefas e Plugins
#
# Os scripts na raiz sao ESQUELETOS de exercicio: a estrutura ja vem pronta e
# TODOs numerados marcam o que voce completa em cada aula. As versoes fechadas
# vivem em solutions/ (rode-as de DENTRO da pasta: cd solutions).
#
#     cd 3-tarefas-e-plugins
#     uv sync
#     export NORNIR_USER="admin" NORNIR_PASS="admin"
#     uv run python resultado_lab.py   # device-free
#     uv run python render_lab.py      # device-free (Jinja2)
#     uv run python sonda_lab.py       # sonda TCP no peer-inet-01 (nem creds precisa)
#     uv run python plugins_lab.py     # netmiko x napalm x scrapli (precisa do lab)
#
# Entram aqui os plugins de conexao (napalm, scrapli) e o de template
# (jinja2). O napalm fala eAPI com os cEOS e SSH com o Cisco IOL; o
# SR Linux fica so com o netmiko (nao ha driver napalm core para ele).

[project]
name = "nornir-lab-cap3"
version = "3.0.0"
description = "Cap. 3 — Tarefas e plugins: tasks custom, netmiko/napalm/scrapli, dry-run e Jinja2"
requires-python = ">=3.12,<3.13"

dependencies = [
    "nornir==3.5.0",
    "nornir-netmiko==1.0.1",
    "nornir-napalm==0.5.0",
    "nornir-scrapli==2025.1.30",
    "nornir-jinja2==0.2.0",
    "nornir-utils==0.2.0",
]

[tool.uv]
package = false
