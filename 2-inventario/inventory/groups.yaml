# --- Dimensao PLATAFORMA (platform + connection_options) ---
eos:
  platform: arista_eos
  connection_options:
    netmiko:
      platform: arista_eos
      extras:
        conn_timeout: 30

ios:
  platform: cisco_ios        # Cisco IOL roda IOS classico
  connection_options:
    netmiko:
      platform: cisco_ios
      extras:
        conn_timeout: 30

srl:
  platform: nokia_srl        # Nokia SR Linux (7220 IXR-D3L)
  connection_options:
    netmiko:
      platform: nokia_srl
      extras:
        conn_timeout: 30

frr:
  platform: linux
  data:
    no_ssh: true             # container FRR sem SSH — gerencia via vtysh

# --- Dimensao SITE ---
pop_a:
  data:
    site: emea-pop-a
    region: emea
pop_b:
  data:
    site: emea-pop-b
    region: emea

# --- Dimensao PAPEL ---
edge:
  data:
    role: edge
core:
  data:
    role: core
cpe:
  data:
    role: cpe
