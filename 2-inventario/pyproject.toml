# nornir-lab/pyproject.toml — Capitulo 2: Gerenciando o Inventario
#
#     cd 2-inventario
#     uv sync
#     export NORNIR_USER="admin" NORNIR_PASS="admin"
#     export SRL_PASS="NokiaSrl1!"           # senha de fabrica do SR Linux
#     uv run python filter_lab.py            # toca o POP A: pe-emea-01,
#                                            # core-rr-01 e ce-custc-01
#
# Aulas 4 e 5 — inventario nascendo de NetBox e Infrahub (device-free, mas
# precisa de rede ate as instancias do curso):
#     export NB_URL="https://acul2501.cloud.netboxapp.com" NB_TOKEN="<token do curso>"
#     export INFRAHUB_ADDRESS="https://infrahub.autonetops.com" INFRAHUB_TOKEN="<token do curso>"
#     uv run python netbox_inventory.py      # Aula 4
#     uv run python infrahub_inventory.py    # Aula 5
#
# nornir-infrahub esta em 1.2.0 aqui (nao 1.1.2 como nos Caps. 6-7): a 1.1.2
# quebra o schema_mapping primary_address.address contra o Infrahub hospedado
# (peer raso no store -> AttributeError em ip_interface_to_ip_string).
#
# Veja o cabecalho de 1-Fundamentals/pyproject.toml para a explicacao do
# `package = false` e da alternativa com venv + pip.

[project]
name = "nornir-lab-cap2"
version = "2.0.0"
description = "Cap. 2 — Inventario: hierarquia, grupos compostos, filtros e transform"
requires-python = ">=3.12,<3.13"

dependencies = [
    "infrahub-sdk==1.22.1",
    "nornir==3.5.0",
    "nornir-infrahub==1.2.0",
    "nornir-netbox==0.3.0",
    "nornir-netmiko==1.0.1",
    "nornir-utils==0.2.0",
]

[tool.uv]
package = false
