# Cada host lista uma dimensao de cada tipo: plataforma, site e papel.
# O que e unico do dispositivo (loopback_ip) continua em data: no host.
pe-emea-01:
  hostname: 172.20.20.11
  groups:
    - eos          # dimensao: plataforma
    - pop_a        # dimensao: site
    - edge         # dimensao: papel
  data:
    loopback_ip: 10.255.0.1
pe-emea-02:
  hostname: 172.20.20.12
  groups:
    - eos
    - pop_b
    - edge
  data:
    loopback_ip: 10.255.0.2
core-rr-01:
  hostname: 172.20.20.13
  groups:
    - ios
    - pop_a
    - core
  data:
    loopback_ip: 10.255.0.3
ce-custc-01:
  hostname: 172.20.20.21
  groups:
    - srl
    - pop_a
    - cpe
ce-custc-02:
  hostname: 172.20.20.22
  groups:
    - srl
    - pop_b
    - cpe
peer-inet-01:
  hostname: 172.20.20.31
  groups:
    - frr
    - pop_b
    - edge
